<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>État Hebdomadaire des Dettes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <!-- Header -->
      <div class="card-header">
        <h1>Achats Locaux</h1>
        <p class="subtitle">
          Uploadez le fichier Excel pour vérifier les montants.
        </p>
      </div>

      <!-- Body -->
      <div class="card-body">
        <label class="field-label" for="file">Fichier Excel (.xlsm)</label>
        <div class="file-row">
          <input type="file" id="file" accept=".xlsx,.xlsm" />
          <button id="calculateBtn">Calculer</button>
        </div>

        <!-- Error -->
        <p class="error hidden" id="errorMsg"></p>

        <!-- Results -->
        <div class="results hidden" id="resultsCard">
          <div class="kpi-row">
            <span class="kpi-label"
              >Factures échues en cours de traitement</span
            >
            <span class="kpi-value" id="kpiOverdue">—</span>
          </div>
          <div class="kpi-row">
            <span class="kpi-label"
              >Factures non échues en cours de traitement</span
            >
            <span class="kpi-value" id="kpiPending">—</span>
          </div>
          <div class="kpi-row">
            <span class="kpi-label">Total Achats Locaux</span>
            <span class="kpi-value" id="kpiTotal">—</span>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
